name: Prove CWS auth

# Throwaway. Deleted once it has answered two questions:
#   1. Does a WIF-minted token get accepted by the Chrome Web Store v2 API?
#   2. What shape is the response body?
#
# See docs/superpowers/plans/2026-07-25-release-automation.md, Task 3.

on: workflow_dispatch

permissions:
  contents: read
  id-token: write # required to mint the GitHub OIDC token for WIF

jobs:
  prove:
    runs-on: ubuntu-latest
    steps:
      - id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.WIF_SERVICE_ACCOUNT }}
          token_format: access_token
          # The full scope, not chromewebstore.readonly — this proves the exact
          # scope the release workflow will ask for.
          access_token_scopes: https://www.googleapis.com/auth/chromewebstore

      - name: Fetch item status (read-only)
        env:
          TOKEN: ${{ steps.auth.outputs.access_token }}
          PUB: ${{ vars.CWS_PUBLISHER_ID }}
          EXT: ${{ vars.CWS_EXTENSION_ID }}
        run: |
          set -euo pipefail
          # There is no plain GET on the item; the read method is the custom
          # verb :fetchStatus (per the v2 discovery document).
          code=$(curl -sS -o response.json -w '%{http_code}' \
            -H "Authorization: Bearer $TOKEN" \
            "https://chromewebstore.googleapis.com/v2/publishers/$PUB/items/$EXT:fetchStatus")

          echo "HTTP $code"
          cat response.json

          # A JSON body means we reached the API surface. An HTML body means the
          # path itself does not exist, and tells us NOTHING about whether the
          # token was accepted — an unauthenticated request gets the same page.
          if ! jq -e . response.json >/dev/null 2>&1; then
            echo "::error::non-JSON response (HTTP $code) — request never reached the API; inconclusive"
            exit 1
          fi

          case "$code" in
            200)
              echo "::notice::WIF token ACCEPTED by the Chrome Web Store v2 API"
              ;;
            401|403)
              echo "::error::WIF token REJECTED (HTTP $code) — WIF is not viable, fall back to a JSON key"
              exit 1
              ;;
            *)
              # A JSON error here means auth got far enough to be evaluated, but
              # something else (ids, linkage propagation) is wrong. Not a WIF verdict.
              echo "::error::reached the API but got HTTP $code — see the body above"
              exit 1
              ;;
          esac
