name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # ubuntu-latest already ships git >= 2.28, unzip and python3, which the
      # suite requires (test/git-http-server.mjs seeds repos with
      # `git init -b main`, test/pack.test.mjs validates the zip with the real
      # unzip binary, and test/menu-config.test.mjs runs the generated
      # menu_config.py through python3's ast + modulefinder).
      - run: npm ci
      - run: npm test
